<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MUNDARIA – Guardianes de la Huella</title>
<style>
:root{--a:#7c5cff;--b:#3a7bff;--c:#8fdcff;--n:#1b1448;--w:#f4f7ff}
body[data-r=fenix]{--a:#ff7a1a;--b:#ffb81f;--c:#ffe29a;--n:#4a1408}
body[data-r=otrix]{--a:#14b8d4;--b:#2f6bff;--c:#9af0ff;--n:#07213f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Arial Rounded MT Bold","Trebuchet MS",sans-serif;color:var(--n)}
body{background:linear-gradient(165deg,var(--n),var(--a) 62%,var(--c));transition:background .6s}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:0}
body.ar #cam{display:block}
#sc{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#sc i{position:absolute;font-style:normal;opacity:.55;animation:fl 7s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-22px) rotate(12deg)}}
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
h1{margin:6px 0 2px;color:#fff;font-size:2rem;text-align:center;letter-spacing:.5px;text-shadow:0 3px 0 var(--n),0 8px 18px rgba(0,0,0,.35)}
.sub{text-align:center;color:var(--c);margin:0 0 12px}
.map{display:grid;gap:10px;overflow:auto;flex:1;align-content:start}
.rc{display:flex;gap:12px;align-items:center;background:rgba(244,247,255,.93);border-radius:20px;padding:10px 12px;border:0;text-align:left;font:inherit;color:var(--n);cursor:pointer;border-left:8px solid var(--k);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.rc:active{transform:scale(.98)}
.rc img{width:78px;height:78px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.rc b{display:block;font-size:1.1rem}.rc small{display:block;opacity:.8;font-family:"Trebuchet MS",sans-serif}
.top{display:flex;align-items:center;gap:8px}
.top button,.bt{border:0;border-radius:14px;background:var(--w);color:var(--n);font:inherit;padding:9px 12px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.mt{flex:1;height:18px;background:rgba(27,20,72,.45);border-radius:10px;overflow:hidden;border:2px solid var(--w)}
.mt div{height:100%;width:50%;background:linear-gradient(90deg,var(--c),var(--w));transition:width .5s}
.ml{color:#fff;font-size:.75rem;text-align:center;margin:2px 0 0;text-shadow:0 1px 4px #000}
#cr{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#cr img{max-height:100%;max-width:75%;object-fit:contain;filter:drop-shadow(0 12px 18px rgba(0,0,0,.45));animation:hov 2.6s ease-in-out infinite}
@keyframes hov{50%{transform:translateY(-12px)}}
#cr.ok img{animation:sal .7s}#cr.no img{animation:sac .5s}
@keyframes sal{40%{transform:translateY(-40px) scale(1.12)}}
@keyframes sac{25%{transform:translateX(-14px) rotate(-4deg)}75%{transform:translateX(14px) rotate(4deg)}}
.card{background:var(--w);border-radius:24px 24px 16px 16px;padding:16px;border-top:7px solid var(--a);box-shadow:0 -6px 24px rgba(0,0,0,.3);line-height:1.4}
.card h2{margin:0 0 6px;font-size:1.1rem}.card p{margin:0 0 10px;font-family:"Trebuchet MS",sans-serif}
.btn{display:block;width:100%;margin-top:8px;padding:13px;border:0;border-radius:14px;background:linear-gradient(90deg,var(--a),var(--b));color:#fff;font:inherit;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.op{background:#fff;color:var(--n);border:3px solid var(--c);text-align:left;box-shadow:none}
.op.s{background:#2fbf8f;color:#fff;border-color:#2fbf8f}.op.f{background:#ff7a7a;color:#fff;border-color:#ff7a7a}
.dots{display:flex;gap:6px;margin-bottom:8px}.dots span{flex:1;height:8px;border-radius:5px;background:#d6dcf0}.dots .d{background:var(--a)}
.ctr{text-align:center}.ctr svg{width:130px}
.stars{font-size:1.6rem;letter-spacing:4px}
#m{position:fixed;inset:0;z-index:20;background:rgba(10,8,30,.75);display:none;align-items:center;justify-content:center;padding:16px}
#m .card{max-width:420px;width:100%;border-radius:22px}#m img{width:100%;border-radius:12px}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body data-r="nebula">

    ["Estás en un wifi público y querés entrar a tu banco. ¿Qué es mejor?",["Entrar igual","Usar datos móviles o una red de confianza","Pedirle la clave a un desconocido"],1,"Las redes públicas pueden ser espiadas."],
    ["Comentás en un video con tu nombre real. ¿Qué huella es?",["Activa","Pasiva"],0,"Es huella activa: vos escribiste y publicaste."]]}};
var K=Object.keys(R),P={},cur,qi,err,huella=50,app=document.getElementById("app");
try{P=JSON.parse(localStorage.getItem("mundaria")||"{}")}catch(e){}

function esc(k){document.body.dataset.r=k;var s=document.getElementById("sc");s.innerHTML="";for(var i=0;i<14;i++){var x=document.createElement("i");x.textContent=R[k].e[i%5];x.style.cssText="left:"+Math.random()*92+"%;top:"+Math.random()*90+"%;font-size:"+(1.2+Math.random()*1.8)+"rem;animation-delay:-"+Math.random()*7+"s";s.appendChild(x)}}
function snd(ok){try{var c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type="triangle";o.frequency.value=ok?660:190;if(ok)o.frequency.setValueAtTime(880,c.currentTime+.12);g.gain.value=.15;o.start();o.stop(c.currentTime+.28)}catch(e){}if(navigator.vibrate)navigator.vibrate(ok?[40]:[80,40,80])}
function home(){esc("nebula");var n=K.filter(function(k){return P[k]}).length;
 app.innerHTML='<h1>MUNDARIA</h1><p class="sub">Guardianes de la Huella · Insignias '+n+'/3</p><div class="map">'+K.map(function(k){var r=R[k];return '<button class="rc" style="--k:'+r.k+'" data-k="'+k+'"><img src="'+IMG[k]+'" alt="'+r.n+'"><span><b>'+r.n+' · '+r.l+'</b><small>'+r.t+'</small><small>'+(P[k]?"🏅 "+"⭐".repeat(P[k]):"Misión sin completar")+'</small></span></button>'}).join("")+(n==3?'<button class="btn" id="fin">🏆 Mi título de Guardián</button>':'')+'<button class="btn" id="ar2" style="background:var(--n)">📷 Probar la cámara AR</button></div>';
 app.querySelectorAll(".rc").forEach(function(b){b.onclick=function(){play(b.dataset.k)}});
 var f=document.getElementById("fin");if(f)f.onclick=final;document.getElementById("ar2").onclick=function(){cam();};}
function top(){return '<div class="top"><button id="bk">←</button><div class="mt"><div id="mb" style="width:'+huella+'%"></div></div><button id="cb">📷 AR</button></div><p class="ml">Huella cuidada</p>'}
function play(k){cur=k;qi=-1;err=0;esc(k);var r=R[k];
 app.innerHTML=top()+'<div id="cr"><img src="'+IMG[k]+'" alt="'+r.n+'"></div><div class="card" id="cd"><h2>'+r.n+' · '+r.l+'</h2><p>'+r.s+'</p><button class="btn" id="go">Empezar misión</button></div>';
 bind();document.getElementById("go").onclick=next}
function bind(){document.getElementById("bk").onclick=function(){if(document.body.classList.contains("ar"))cam();home()};document.getElementById("cb").onclick=cam}
function next(){qi++;var r=R[cur];if(qi>=r.q.length)return fin2();var q=r.q[qi];
 document.getElementById("cd").innerHTML='<div class="dots">'+r.q.map(function(_,i){return '<span class="'+(i<=qi?"d":"")+'"></span>'}).join("")+'</div><h2>Desafío '+(qi+1)+'</h2><p>'+q[0]+'</p><div id="ops"></div><p id="fb"></p>';
 q[1].forEach(function(t,i){var b=document.createElement("button");b.className="btn op";b.textContent=t;b.onclick=function(){resp(i,b)};document.getElementById("ops").appendChild(b)})}
function resp(i,b){var q=R[cur].q[qi],cr=document.getElementById("cr"),fb=document.getElementById("fb"),ok=i==q[2];
 cr.className="";void cr.offsetWidth;cr.className=ok?"ok":"no";snd(ok);
 if(ok){b.classList.add("s");huella=Math.min(100,huella+15);fb.innerHTML="✅ "+q[3]+'<button class="btn" id="nx">'+(qi+1<R[cur].q.length?"Siguiente":"Terminar misión")+'</button>';
  document.querySelectorAll(".op").forEach(function(x){x.disabled=true});document.getElementById("nx").onclick=next}
 else{b.classList.add("f");b.disabled=true;err++;huella=Math.max(0,huella-10);fb.textContent="❌ Casi. Probá con otra opción."}
 document.getElementById("mb").style.width=huella+"%"}
function badge(k){var r=R[k];return '<svg viewBox="0 0 120 140" aria-label="Insignia"><defs><linearGradient id="g'+k+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+r.k+'"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><path d="M60 6 112 26V70C112 104 88 126 60 136 32 126 8 104 8 70V26Z" fill="url(#g'+k+')" stroke="#1b1448" stroke-width="5"/><text x="60" y="84" font-size="46" text-anchor="middle">'+r.e[0]+'</text></svg>'}
function fin2(){var s=Math.max(1,3-err);P[cur]=Math.max(P[cur]||0,s);sv();snd(true);
 document.getElementById("cd").className="card ctr";document.getElementById("cd").innerHTML=badge(cur)+'<h2>¡Insignia de '+R[cur].n+'!</h2><div class="stars">'+"⭐".repeat(s)+'</div><p>Misión «'+R[cur].t+'» completada.</p><button class="btn" id="ph">📸 Sacarme una foto con '+R[cur].n+'</button><button class="btn" id="mp" style="background:var(--n)">Volver al mapa</button>';
 document.getElementById("ph").onclick=function(){cam(true)};document.getElementById("mp").onclick=function(){if(document.body.classList.contains("ar"))cam();home()}}
function final(){esc("nebula");app.innerHTML='<h1>🏆</h1><div class="card ctr"><h2>¡Guardián de la Huella de MUNDARIA!</h2><p>Completaste las tres misiones: protegiste tus datos, cuidaste tu reputación y descubriste los rastros invisibles. Cada cosa que hacés en internet deja una huella: ahora sabés cuidarla.</p><div style="display:flex">'+K.map(badge).join("")+'</div><button class="btn" id="mp">Volver al mapa</button></div>';document.getElementById("mp").onclick=home}
var st=null;
function cam(foto){var v=document.getElementById("cam");
 if(st&&!foto){st.getTracks().forEach(function(t){t.stop()});st=null;document.body.classList.remove("ar");return}
 if(st&&foto)return shot();
 navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false}).then(function(s){st=s;v.srcObject=s;document.body.classList.add("ar");if(foto)setTimeout(shot,800)}).catch(function(){alert("No pude abrir la cámara. Revisá el permiso del navegador.")})}
function shot(){var v=document.getElementById("cam"),im=document.querySelector("#cr img");if(!v.videoWidth)return;
 var c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;var x=c.getContext("2d");x.drawImage(v,0,0);
 var w=c.width*.6,h=w*im.naturalHeight/im.naturalWidth;x.drawImage(im,(c.width-w)/2,c.height-h-c.height*.05,w,h);
 var u=c.toDataURL("image/jpeg",.85),m=document.getElementById("m");m.style.display="flex";
 m.innerHTML='<div class="card"><img src="'+u+'" alt="Tu foto"><h2>¿Y si la publicás?</h2><p>Esta foto tiene tu entorno y tu imagen. Si la subís a una red, ¿qué huella dejás?</p><button class="btn op" data-v="1">Activa: yo decidí compartirla</button><button class="btn op" data-v="0">Pasiva: se registra sola</button><p id="fm"></p><a class="btn" style="text-align:center;text-decoration:none" href="'+u+'" download="mundaria-foto.jpg">Guardar foto</a><button class="btn" id="cl" style="background:var(--n)">Cerrar</button></div>';
 m.querySelectorAll(".op").forEach(function(b){b.onclick=function(){var ok=b.dataset.v=="1";b.classList.add(ok?"s":"f");document.getElementById("fm").textContent=ok?"✅ Correcto: es huella activa. Pensá antes de publicar.":"❌ No: vos elegís publicarla, es huella activa."}});
 document.getElementById("cl").onclick=function(){m.style.display="none"}}
home();
</script></body></html>
